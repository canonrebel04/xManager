plugins {
	id 'com.android.application'
}

// Update-server endpoint, read at build time. Not committed on purpose; set it with
//   ./gradlew assembleDebug -PxmanagerApiUrl=https://example.org/api.json
// or xmanagerApiUrl=... in ~/.gradle/gradle.properties (or ORG_GRADLE_PROJECT_xmanagerApiUrl).
// Empty means "no server configured": the app shows a message instead of loading.
def xmanagerApiUrl = (project.findProperty('xmanagerApiUrl') ?: '').toString().trim()

android {
	namespace 'com.xc3fff0e.xmanager'
	compileSdk 35

	useLibrary 'org.apache.http.legacy'

	defaultConfig {
		applicationId "com.xc3fff0e.xmanager"
		minSdk 21
		targetSdk 35
		versionCode 230224
		versionName "5.9"
		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
		buildConfigField 'String', 'API_URL', '"' + xmanagerApiUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
	}

	buildFeatures {
		buildConfig true
	}

	testOptions {
		unitTests {
			includeAndroidResources = true
			all {
				// Robolectric needs extra heap for the large main.xml layout.
				maxHeapSize = "2g"
			}
		}
		animationsDisabled = true
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}
}

dependencies {
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'com.google.android.material:material:1.13.0'
	implementation 'androidx.browser:browser:1.8.0'
	implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
	implementation 'com.github.bumptech.glide:glide:4.16.0'
	implementation 'com.google.code.gson:gson:2.14.0'
	implementation 'com.squareup.okhttp3:okhttp:4.12.1'

	// JVM unit tests (src/test)
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.robolectric:robolectric:4.14.1'
	testImplementation 'androidx.test:core:1.7.0'
	testImplementation 'androidx.test.ext:junit:1.3.0'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

	// Instrumented / emulator tests (src/androidTest)
	androidTestImplementation 'androidx.test:runner:1.7.0'
	androidTestImplementation 'androidx.test:rules:1.7.0'
	androidTestImplementation 'androidx.test:core:1.7.0'
	androidTestImplementation 'androidx.test.ext:junit:1.3.0'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
	androidTestImplementation 'androidx.test.espresso:espresso-accessibility:3.7.0'
	androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
